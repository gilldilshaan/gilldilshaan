<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Terminal — who is Dilshaan Gill">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#8B7CF8"/>
    </linearGradient>
  </defs>

  <rect width="900" height="300" rx="14" fill="#0A0F1D"/>
  <rect x="0.5" y="0.5" width="899" height="299" rx="14" fill="none" stroke="#24355A" stroke-width="1"/>

  <rect x="1" y="1" width="898" height="44" rx="13" fill="#101830"/>
  <rect x="1" y="23" width="898" height="22" fill="#101830"/>
  <line x1="1" y1="46" x2="899" y2="46" stroke="#24355A" stroke-width="1"/>

  <circle cx="30" cy="23" r="4" fill="#33415E"/>
  <circle cx="48" cy="23" r="4" fill="#33415E"/>
  <circle cx="66" cy="23" r="4" fill="#5B8CFF"/>

  <text x="450" y="28" fill="#8CA3C7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="middle">dilshaan@github — ~</text>

  <circle cx="840" cy="23" r="4" fill="#4CC38A">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="852" y="28" fill="#8CA3C7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" text-anchor="end">online</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.2s" fill="freeze"/>
      <text x="36" y="88" fill="#E9EEF7"><tspan fill="#5B8CFF">$</tspan> whoami</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.7s" fill="freeze"/>
      <text x="36" y="118" fill="#8CA3C7">dilshaan — ai/ml engineer · full-stack developer</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.2s" fill="freeze"/>
      <text x="36" y="148" fill="#E9EEF7"><tspan fill="#5B8CFF">$</tspan> ./run --focus</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.6s" fill="freeze"/>
      <text x="36" y="178" fill="#8CA3C7">building AI agents</text>
      <rect x="230" y="170" width="240" height="8" rx="4" fill="#141D31" stroke="#24355A" stroke-width="1"/>
      <rect x="230" y="170" width="0" height="8" rx="4" fill="url(#brand)">
        <animate attributeName="width" values="0;240" dur="1.2s" begin="2s" fill="freeze"/>
      </rect>
      <text x="482" y="179" fill="#4CC38A">done</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.5s" fill="freeze"/>
      <text x="36" y="208" fill="#8CA3C7">training pipelines</text>
      <rect x="230" y="200" width="240" height="8" rx="4" fill="#141D31" stroke="#24355A" stroke-width="1"/>
      <rect x="230" y="200" width="0" height="8" rx="4" fill="#5B8CFF">
        <animate attributeName="width" values="0;172" dur="1.4s" begin="2.9s" fill="freeze"/>
      </rect>
      <text x="482" y="209" fill="#8CA3C7">72%</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.4s" fill="freeze"/>
      <text x="36" y="238" fill="#E9EEF7"><tspan fill="#5B8CFF">$</tspan> tail -f focus</text>
      <rect x="176" y="225" width="9" height="16" fill="#5B8CFF">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.2s" fill="freeze"/>
      <circle cx="36" cy="263" r="4" fill="#4CC38A">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="50" y="268" fill="#4CC38A">system online — good</text>
    </g>
  </g>
</svg>
