  <text x="44" y="118" fill="#17130F" font-family="'Courier New',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" mask="url(#m0)">I don't ship demos. I ship things that stay up.</text><mask id="m1" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="320">
    <rect x="0" y="0" width="0" height="320" fill="#FFFFFF">
