    </rect>
  </mask>
  <text x="44" y="158" fill="#17130F" font-family="'Courier New',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" mask="url(#m1)">Most of my time goes to the boring 20% —</text><mask id="m2" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="320">
    <rect x="0" y="0" width="0" height="320" fill="#FFFFFF">
      <animate attributeName="width" values="0;469" dur="0.85s" begin="2.75s" fill="freeze"/>
    </rect>
  </mask>
  <text x="44" y="198" fill="#17130F" font-family="'Courier New',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" mask="url(#m2)">the part that makes the clever 80% reliable.</text><mask id="m3" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="320">
    <rect x="0" y="0" width="0" height="320" fill="#FFFFFF">
      <animate attributeName="width" values="0;591" dur="1.3s" begin="3.8s" fill="freeze"/>
    </rect>
  </mask>
  <text x="44" y="238" fill="#17130F" font-family="'Courier New',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" mask="url(#m3)">AI agents are only interesting once they're accountable.</text>
