<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Engineering pipeline — idea to iterate">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#8B7CF8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#5B8CFF"/>
    </marker>
    <marker id="arrowV" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#8B7CF8"/>
    </marker>
  </defs>

  <rect width="900" height="240" rx="14" fill="#0A0F1D"/>
  <rect x="0.5" y="0.5" width="899" height="239" rx="14" fill="none" stroke="#24355A" stroke-width="1"/>

  <path id="loop" d="M 810 78 C 810 18, 110 18, 110 78" fill="none" stroke="#8B7CF8" stroke-width="2" stroke-dasharray="6 6" opacity="0.65" marker-end="url(#arrowV)"/>
  <text x="450" y="30" fill="#8B7CF8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" text-anchor="middle" letter-spacing="3">ITERATE</text>

  <g stroke="#24355A" stroke-width="2" fill="none">
    <line x1="118" y1="104" x2="242" y2="104" marker-end="url(#arrow)"/>
    <line x1="258" y1="104" x2="382" y2="104" marker-end="url(#arrow)"/>
    <line x1="398" y1="104" x2="522" y2="104" marker-end="url(#arrow)"/>
    <line x1="538" y1="104" x2="662" y2="104" marker-end="url(#arrow)"/>
    <line x1="678" y1="104" x2="802" y2="104" marker-end="url(#arrowV)"/>
  </g>

  <g fill="#0A0F1D" stroke="#5B8CFF" stroke-width="2">
    <circle cx="110" cy="104" r="5"/>
    <circle cx="250" cy="104" r="5"/>
    <circle cx="390" cy="104" r="5"/>
    <circle cx="530" cy="104" r="5"/>
    <circle cx="670" cy="104" r="5"/>
  </g>
  <circle cx="810" cy="104" r="5" fill="#0A0F1D" stroke="#8B7CF8" stroke-width="2"/>

  <g fill="#8CA3C7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" text-anchor="middle">
    <text x="110" y="136">IDEA</text>
    <text x="250" y="136">PROTOTYPE</text>
    <text x="390" y="136">ENGINEERING</text>
    <text x="530" y="136">TESTING</text>
    <text x="670" y="136">DEPLOY</text>
    <text x="810" y="136">ITERATE</text>
  </g>

  <g>
    <circle r="4" fill="#5B8CFF">
      <animate attributeName="cx" values="118;242" dur="2.2s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="cy" values="104;104" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#5B8CFF">
      <animate attributeName="cx" values="118;242" dur="2.2s" repeatCount="indefinite" begin="1.1s"/>
      <animate attributeName="cy" values="104;104" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#5B8CFF">
      <animate attributeName="cx" values="258;382" dur="2.2s" repeatCount="indefinite" begin="0.45s"/>
      <animate attributeName="cy" values="104;104" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#5B8CFF">
      <animate attributeName="cx" values="258;382" dur="2.2s" repeatCount="indefinite" begin="1.55s"/>
      <animate attributeName="cy" values="104;104" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#5B8CFF">
      <animate attributeName="cx" values="398;522" dur="2.2s" repeatCount="indefinite" begin="0.9s"/>
      <animate attributeName="cy" values="104;104" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#5B8CFF">
      <animate attributeName="cx" values="538;662" dur="2.2s" repeatCount="indefinite" begin="1.35s"/>
      <animate attributeName="cy" values="104;104" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#8B7CF8">
      <animate attributeName="cx" values="678;802" dur="2.2s" repeatCount="indefinite" begin="1.8s"/>
      <animate attributeName="cy" values="104;104" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#8B7CF8">
      <animateMotion dur="4.4s" repeatCount="indefinite" begin="2.2s">
        <mpath href="#loop"/>
      </animateMotion>
    </circle>
  </g>

  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
    <text x="450" y="180" fill="#E9EEF7" font-size="18" font-weight="700">I don't just experiment with AI.</text>
    <text x="450" y="206" fill="url(#brand)" font-size="18" font-weight="700">I build systems around it.</text>
  </g>
</svg>
