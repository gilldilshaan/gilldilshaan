<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Dilshaan Gill — AI/ML engineer and full-stack developer">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B8CFF"><animate attributeName="stop-color" values="#5B8CFF;#7AA5FF;#5B8CFF" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#8B7CF8"><animate attributeName="stop-color" values="#8B7CF8;#A895FF;#8B7CF8" dur="9s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1B305E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1B305E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A2158" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2A2158" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="90">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="900" height="380" rx="20" fill="#0A0F1D"/>
  <rect x="0.5" y="0.5" width="899" height="379" rx="20" fill="none" stroke="#24355A" stroke-width="1"/>

  <circle cx="120" cy="50" r="250" fill="url(#glowB)"/>
  <circle cx="780" cy="350" r="270" fill="url(#glowV)"/>

  <g stroke="#131C33" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="380"/><line x1="180" y1="0" x2="180" y2="380"/>
    <line x1="270" y1="0" x2="270" y2="380"/><line x1="360" y1="0" x2="360" y2="380"/>
    <line x1="450" y1="0" x2="450" y2="380"/><line x1="540" y1="0" x2="540" y2="380"/>
    <line x1="630" y1="0" x2="630" y2="380"/><line x1="720" y1="0" x2="720" y2="380"/>
    <line x1="810" y1="0" x2="810" y2="380"/>
    <line x1="0" y1="76" x2="900" y2="76"/><line x1="0" y1="152" x2="900" y2="152"/>
    <line x1="0" y1="228" x2="900" y2="228"/><line x1="0" y1="304" x2="900" y2="304"/>
  </g>

  <rect x="0" width="900" height="90" fill="url(#scan)">
    <animate attributeName="y" values="-90;380" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g>
    <circle cx="36" cy="42" r="5" fill="#4CC38A">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="52" y="47" fill="#8CA3C7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">gilldilshaan · cs student · chandigarh</text>
    <text x="864" y="47" fill="#8CA3C7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" text-anchor="end">status: focusing</text>
  </g>

  <text x="36" y="116" fill="#5B8CFF" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="5">AI/ML ENGINEER · FULL-STACK DEVELOPER · BUILDER</text>

  <text x="36" y="206" fill="url(#brand)" filter="url(#shadow)" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="800" letter-spacing="4">DILSHAAN GILL</text>

  <text x="36" y="248" fill="#8CA3C7" font-family="Arial,Helvetica,sans-serif" font-size="15">Building AI-powered products, intelligent systems, and production-ready software.</text>

  <line x1="36" y1="284" x2="864" y2="284" stroke="#24355A" stroke-width="1"/>

  <text x="36" y="320" fill="#5B8CFF" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">$ whoami</text>
  <rect x="102" y="307" width="9" height="16" fill="#5B8CFF">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="864" y="320" fill="#5B8CFF" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" text-anchor="end">→ building ai agents · ml frameworks · production software</text>

  <g fill="#5B8CFF">
    <circle cx="150" cy="60" r="2"><animate attributeName="opacity" values="0;0.6;0" dur="4.5s" repeatCount="indefinite" begin="0s"/></circle>
    <circle cx="620" cy="42" r="1.8"><animate attributeName="opacity" values="0;0.6;0" dur="5s" repeatCount="indefinite" begin="1.2s"/></circle>
    <circle cx="830" cy="150" r="2.2"><animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite" begin="2s"/></circle>
    <circle cx="300" cy="250" r="1.6"><animate attributeName="opacity" values="0;0.6;0" dur="4.8s" repeatCount="indefinite" begin="0.8s"/></circle>
    <circle cx="520" cy="120" r="1.8"><animate attributeName="opacity" values="0;0.6;0" dur="5.4s" repeatCount="indefinite" begin="2.6s"/></circle>
    <circle cx="700" cy="220" r="2"><animate attributeName="opacity" values="0;0.6;0" dur="4.2s" repeatCount="indefinite" begin="3.2s"/></circle>
  </g>
</svg>
